<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca</title>
    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <header class="header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <h1 class="heading-xl">Minha Biblioteca</h1>
            </div>
            <button type="button" id="btnNewBook" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Adicionar livro
            </button>
        </header>

        <!-- Estatísticas -->
        <section class="stats-grid">
            <div class="stat-card">
                <span class="heading-xl" id="statTotal">0</span>
                <span class="body-sm">Total</span>
            </div>
            <div class="stat-card">
                <span class="heading-xl" id="statQueroLer">0</span>
                <span class="body-sm">Quero ler</span>
            </div>
            <div class="stat-card">
                <span class="heading-xl" id="statLendo">0</span>
                <span class="body-sm">Lendo</span>
            </div>
            <div class="stat-card">
                <span class="heading-xl" id="statLidos">0</span>
                <span class="body-sm">Lidos</span>
            </div>
        </section>

        <!-- Filtros e Pesquisa -->
        <section class="filters-container">
            <div class="search-wrapper">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" class="input-field" placeholder="Buscar por título ou autor...">
            </div>
            <div class="select-wrapper">
                <select id="filterStatus" class="input-field">
                    <option value="Todos">Todos os status</option>
                    <option value="Quero ler">Quero ler</option>
                    <option value="Lendo">Lendo</option>
                    <option value="Lido">Lido</option>
                </select>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </section>

        <!-- Grid de Livros -->
        <main id="booksGrid" class="books-grid">
            <!-- Cards injetados via JS -->
        </main>
    </div>

    <!-- Modal Adicionar/Editar -->
    <dialog id="bookModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="heading-lg">Adicionar Livro</h2>
                <button type="button" id="btnCloseModal" class="btn-close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <form id="bookForm">
                <input type="hidden" id="bookId">

                <!-- Bloco de Pesquisa Automática -->
                <div style="margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--gray-200);">
                    <label class="form-label" style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 600; color: var(--navy-dark);">⚡ Preenchimento Automático</span>
                        <span id="amazonStatus" style="font-size: 12px; font-weight: 500;"></span>
                    </label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="autoFillInput" class="input-field" placeholder="Cole o link da Amazon, ISBN ou título..." style="flex: 1;">
                        <button type="button" id="btnAutoFill" class="btn btn-secondary">Buscar</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="title">Título *</label>
                    <input type="text" id="title" class="input-field" required placeholder="Digite o título do livro">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="author">Autor *</label>
                    <input type="text" id="author" class="input-field" required placeholder="Digite o nome do autor">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="coverUrl">URL da imagem</label>
                    <input type="url" id="coverUrl" class="input-field" placeholder="URL da capa do livro (opcional)">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="status">Status</label>
                    <div class="select-wrapper">
                        <select id="status" class="input-field" required>
                            <option value="Quero ler">Quero ler</option>
                            <option value="Lendo">Lendo</option>
                            <option value="Lido">Lido</option>
                        </select>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Avaliação</label>
                    <div class="rating-container">
                        <div class="star-rating-input" id="starRatingInput">
                            <!-- Estrelas inseridas via JS -->
                        </div>
                        <button type="button" id="btnClearRating" class="btn-limpar">Limpar</button>
                        <input type="hidden" id="rating" value="0">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="comment">Comentário</label>
                    <textarea id="comment" class="input-field" rows="3" placeholder="Suas anotações sobre o livro (opcional)"></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="button" id="btnCancel" class="btn-ghost">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmit">Adicionar</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
